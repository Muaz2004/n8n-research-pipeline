<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Research Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-container">
    <header class="header">
      <p class="tag">AI Research Pipeline</p>
      <h1 class="title">Research Task Ingestion</h1>
      <p class="subtitle">Submit research parameters for automated Tavily retrieval, AI synthesis, and human approval.</p>
    </header>

    <form id="research-form" class="research-form" novalidate>
      <div class="field-group">
        <label for="topic">Topic</label>
        <input 
          type="text" 
          id="topic" 
          name="topic" 
          placeholder="e.g. CRISPR gene therapies in clinical trials" 
          required 
          autocomplete="off"
        />
      </div>

      <div class="field-group">
        <label for="subtopics">Subtopics</label>
        <input 
          type="text" 
          id="subtopics" 
          name="subtopics" 
          placeholder="e.g. off-target effects, delivery vectors, FDA approvals" 
          autocomplete="off"
        />
      </div>

      <div class="field-group">
        <label for="description">Description</label>
        <textarea 
          id="description" 
          name="description" 
          rows="4" 
          placeholder="Provide context, specific scope, hypotheses, or evaluation criteria..."
        ></textarea>
      </div>

      <div class="field-group">
        <label for="reviewer_email">Reviewer Email</label>
        <input 
          type="email" 
          id="reviewer_email" 
          name="reviewer_email" 
          placeholder="reviewer@example.com" 
          required 
          autocomplete="email"
        />
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">
        <span>Launch Pipeline</span>
      </button>

      <div id="status-message" class="status-message" aria-live="polite"></div>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
